plugins {
    alias(libs.plugins.android.library)
    id 'maven-publish'
}

group = 'com.github.iammert'
version = '2.0.0'

android {
    namespace = 'co.mobiwise.materialintro'
    compileSdk = 36

    defaultConfig {
        minSdk = 21
        consumerProguardFiles 'consumer-rules.pro'
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }

    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }
}

dependencies {
    implementation libs.androidx.annotation
    implementation libs.androidx.cardview

    testImplementation libs.junit
    testImplementation libs.androidx.test.core
    testImplementation libs.robolectric
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                artifactId = 'MaterialIntroView'

                pom {
                    name = 'MaterialIntroView'
                    description = 'Material showcase library for Android'
                    url = 'https://github.com/iammert/MaterialIntroView'
                    licenses {
                        license {
                            name = 'The Apache License, Version 2.0'
                            url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                        }
                    }
                }
            }
        }
    }
}
